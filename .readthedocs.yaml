version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt

# Deliberately no `- path: .` install of the project itself: API docs are
# generated by sphinx-autoapi via static analysis of src/atlas_physics, so
# torch and the other runtime dependencies are not needed to build the docs.
# See docs/source/conf.py for the reasoning.
